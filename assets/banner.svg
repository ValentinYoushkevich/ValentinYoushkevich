<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 854 180" width="854" height="180" role="img" aria-label="Valentin Youshkevich — full-stack developer and AI integrator, TypeScript">
  <title>Valentin Youshkevich — Full-stack developer · AI integrator · TypeScript</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#101a26"/>
      <stop offset="100%" stop-color="#0b1c1a"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#41b883"/>
      <stop offset="100%" stop-color="#41b883" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#41b883" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#41b883" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#41b883" stop-opacity="0"/>
      <stop offset="50%" stop-color="#41b883" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#41b883" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card">
      <rect x="0" y="0" width="854" height="180" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect x="0" y="0" width="854" height="180" fill="url(#bg)"/>
    <ellipse cx="690" cy="106" rx="215" ry="130" fill="url(#glow)"/>

    <!-- name block -->
    <text x="44" y="79" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="31" font-weight="700" fill="#e6edf3" letter-spacing="-0.3">Valentin Youshkevich</text>
    <rect x="44" y="95" width="124" height="3" rx="1.5" fill="url(#rule)"/>
    <text x="44" y="123" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" fill="#9aa7b4">Full-stack developer · AI integrator · TypeScript</text>
    <text x="44" y="146" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#5f6e7d">open source: merged PRs across the Vue toolchain</text>


    <!-- the Vue toolchain, layer by layer -->
    <g font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif">
      <line x1="562" y1="44.0" x2="562" y2="140.0" stroke="#41b883" stroke-opacity="0.30" stroke-width="2"/>
      <circle cx="562" cy="44.0" r="3" fill="#41b883">
        <animate attributeName="cy" values="44.0;140.0" dur="3.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="3.2s" repeatCount="indefinite"/>
      </circle>
      <line x1="562" y1="44.0" x2="584" y2="44.0" stroke="#41b883" stroke-opacity="0.35" stroke-width="1.5"/>
      <circle cx="562" cy="44.0" r="4.5" fill="#0d1117" stroke="#41b883" stroke-width="2"/>
      <rect x="584" y="33" width="214" height="22" rx="5" fill="#41b883" fill-opacity="0.160" stroke="#41b883" stroke-opacity="0.35"/>
      <text x="596" y="47.8" font-size="10" font-weight="600" fill="#41b883" letter-spacing="1.8">RENDERER</text>
      <text x="786" y="48.0" font-size="11" fill="#9aa7b4" text-anchor="end">vuejs/core</text>
      <line x1="562" y1="76.0" x2="584" y2="76.0" stroke="#41b883" stroke-opacity="0.35" stroke-width="1.5"/>
      <circle cx="562" cy="76.0" r="4.5" fill="#0d1117" stroke="#41b883" stroke-width="2"/>
      <rect x="584" y="65" width="214" height="22" rx="5" fill="#41b883" fill-opacity="0.135" stroke="#41b883" stroke-opacity="0.35"/>
      <text x="596" y="79.8" font-size="10" font-weight="600" fill="#41b883" letter-spacing="1.8">LINTER</text>
      <text x="786" y="80.0" font-size="11" fill="#9aa7b4" text-anchor="end">eslint-plugin-vue</text>
      <line x1="562" y1="108.0" x2="584" y2="108.0" stroke="#41b883" stroke-opacity="0.35" stroke-width="1.5"/>
      <circle cx="562" cy="108.0" r="4.5" fill="#0d1117" stroke="#41b883" stroke-width="2"/>
      <rect x="584" y="97" width="214" height="22" rx="5" fill="#41b883" fill-opacity="0.110" stroke="#41b883" stroke-opacity="0.35"/>
      <text x="596" y="111.8" font-size="10" font-weight="600" fill="#41b883" letter-spacing="1.8">TYPES</text>
      <text x="786" y="112.0" font-size="11" fill="#9aa7b4" text-anchor="end">language-tools</text>
      <line x1="562" y1="140.0" x2="584" y2="140.0" stroke="#41b883" stroke-opacity="0.35" stroke-width="1.5"/>
      <circle cx="562" cy="140.0" r="4.5" fill="#0d1117" stroke="#41b883" stroke-width="2"/>
      <rect x="584" y="129" width="214" height="22" rx="5" fill="#41b883" fill-opacity="0.085" stroke="#41b883" stroke-opacity="0.35"/>
      <text x="596" y="143.8" font-size="10" font-weight="600" fill="#41b883" letter-spacing="1.8">TESTS</text>
      <text x="786" y="144.0" font-size="11" fill="#9aa7b4" text-anchor="end">test-utils</text>
      <svg x="810" y="80.0" width="26" height="23" viewBox="0 0 262 227"><path d="M161.096.001l-30.225 52.351L100.647.001H-.005l130.877 226.688L261.749.001z" fill="#41b883"/><path d="M161.096.001l-30.225 52.351L100.647.001H52.346l78.526 136.01L209.398.001z" fill="#34495e"/></svg>
    </g>

    <!-- bottom sweep -->
    <rect x="0" y="176" width="854" height="4" fill="#41b883" fill-opacity="0.12"/>
    <rect x="-280" y="176" width="280" height="4" fill="url(#sweep)">
      <animate attributeName="x" from="-280" to="854" dur="6.5s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
