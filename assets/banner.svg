<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 854 180" width="854" height="180" role="img" aria-label="Valentin Youshkevich — full-stack developer and AI integrator, TypeScript">
  <title>Valentin Youshkevich — Full-stack developer · AI integrator · TypeScript</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#101a26"/>
      <stop offset="100%" stop-color="#0b1c1a"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#41b883"/>
      <stop offset="100%" stop-color="#41b883" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#41b883" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#41b883" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#41b883" stop-opacity="0"/>
      <stop offset="50%" stop-color="#41b883" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#41b883" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card">
      <rect x="0" y="0" width="854" height="180" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect x="0" y="0" width="854" height="180" fill="url(#bg)"/>
    <ellipse cx="690" cy="106" rx="215" ry="130" fill="url(#glow)"/>

    <!-- name block -->
    <text x="44" y="79" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="31" font-weight="700" fill="#e6edf3" letter-spacing="-0.3">Valentin Youshkevich</text>
    <rect x="44" y="95" width="124" height="3" rx="1.5" fill="url(#rule)"/>
    <text x="44" y="123" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" fill="#9aa7b4">Full-stack developer · AI integrator · TypeScript</text>
    <text x="44" y="146" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#5f6e7d">open source: finding where Vapor and VDOM disagree</text>

    <!-- parity diagram -->
    <g font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif">
      <text x="612" y="52" font-size="10.5" fill="#6e7d8c" letter-spacing="2.2" text-anchor="middle">VDOM</text>
      <text x="762" y="52" font-size="10.5" fill="#6e7d8c" letter-spacing="2.2" text-anchor="middle">VAPOR</text>

      <line x1="612" y1="82" x2="612" y2="146" stroke="#41b883" stroke-opacity="0.30" stroke-width="2"/>
      <line x1="762" y1="82" x2="762" y2="146" stroke="#41b883" stroke-opacity="0.30" stroke-width="2"/>

      <!-- row 1 : match -->
      <line x1="621" y1="82" x2="676" y2="82" stroke="#41b883" stroke-opacity="0.28" stroke-width="1.5" stroke-dasharray="3 4"/>
      <line x1="698" y1="82" x2="753" y2="82" stroke="#41b883" stroke-opacity="0.28" stroke-width="1.5" stroke-dasharray="3 4"/>
      <text x="687" y="86.5" font-size="13" fill="#41b883" fill-opacity="0.55" text-anchor="middle">=</text>

      <!-- row 2 : mismatch -->
      <line x1="621" y1="114" x2="676" y2="114" stroke="#ffb454" stroke-width="1.8" stroke-dasharray="4 4">
        <animate attributeName="stroke-dashoffset" from="0" to="-16" dur="1.1s" repeatCount="indefinite"/>
      </line>
      <line x1="698" y1="114" x2="753" y2="114" stroke="#ffb454" stroke-width="1.8" stroke-dasharray="4 4">
        <animate attributeName="stroke-dashoffset" from="0" to="-16" dur="1.1s" repeatCount="indefinite"/>
      </line>
      <text x="687" y="119" font-size="14" font-weight="700" fill="#ffb454" text-anchor="middle">&#8800;</text>

      <!-- row 3 : match -->
      <line x1="621" y1="146" x2="676" y2="146" stroke="#41b883" stroke-opacity="0.28" stroke-width="1.5" stroke-dasharray="3 4"/>
      <line x1="698" y1="146" x2="753" y2="146" stroke="#41b883" stroke-opacity="0.28" stroke-width="1.5" stroke-dasharray="3 4"/>
      <text x="687" y="150.5" font-size="13" fill="#41b883" fill-opacity="0.55" text-anchor="middle">=</text>

      <!-- nodes -->
      <circle cx="612" cy="82" r="6.5" fill="#0d1117" stroke="#41b883" stroke-width="2"/>
      <circle cx="762" cy="82" r="6.5" fill="#0d1117" stroke="#41b883" stroke-width="2"/>
      <circle cx="612" cy="146" r="6.5" fill="#0d1117" stroke="#41b883" stroke-width="2"/>
      <circle cx="762" cy="146" r="6.5" fill="#0d1117" stroke="#41b883" stroke-width="2"/>

      <circle cx="612" cy="114" r="6.5" fill="#0d1117" stroke="#41b883" stroke-width="2"/>
      <circle cx="762" cy="114" r="8" fill="#0d1117" stroke="#ffb454" stroke-width="2.4"/>
      <circle cx="762" cy="114" r="8" fill="none" stroke="#ffb454" stroke-width="1.6">
        <animate attributeName="r" values="8;17" dur="2.4s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0.55;0" dur="2.4s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- bottom sweep -->
    <rect x="0" y="176" width="854" height="4" fill="#41b883" fill-opacity="0.12"/>
    <rect x="-280" y="176" width="280" height="4" fill="url(#sweep)">
      <animate attributeName="x" from="-280" to="854" dur="6.5s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
