<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 854 180" width="854" height="180" role="img" aria-label="Valentin Youshkevich — full-stack developer and AI integrator, TypeScript">
  <title>Valentin Youshkevich — Full-stack developer · AI integrator · TypeScript</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#101a26"/>
      <stop offset="100%" stop-color="#0b1c1a"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#41b883"/>
      <stop offset="100%" stop-color="#41b883" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#41b883" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#41b883" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#41b883" stop-opacity="0"/>
      <stop offset="50%" stop-color="#41b883" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#41b883" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card">
      <rect x="0" y="0" width="854" height="180" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect x="0" y="0" width="854" height="180" fill="url(#bg)"/>
    <ellipse cx="690" cy="106" rx="215" ry="130" fill="url(#glow)"/>

    <!-- name block -->
    <text x="44" y="79" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="31" font-weight="700" fill="#e6edf3" letter-spacing="-0.3">Valentin Youshkevich</text>
    <rect x="44" y="95" width="124" height="3" rx="1.5" fill="url(#rule)"/>
    <text x="44" y="123" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" fill="#9aa7b4">Full-stack developer · AI integrator · TypeScript</text>
    <text x="44" y="146" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#5f6e7d">open source: merged PRs across the Vue toolchain</text>


    <!-- merged PRs per toolchain layer, regenerated daily by update-prs.mjs -->
    <!--m:layers-->
    <g font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif">
      <text x="572" y="53" font-size="10" fill="#6e7d8c" letter-spacing="1.6" text-anchor="end">RENDERER</text>
      <rect x="584" y="42" width="130" height="15" rx="3" fill="#41b883" fill-opacity="0.08"/>
      <rect x="584" y="42" width="130.0" height="15" rx="3" fill="#41b883" fill-opacity="0.90"/>
      <text x="708.0" y="53.5" font-size="10.5" font-weight="700" fill="#0d1117" text-anchor="end">120</text>
      <text x="724" y="53.5" font-size="10.5" fill="#9aa7b4">vuejs/core</text>
      <text x="572" y="84" font-size="10" fill="#6e7d8c" letter-spacing="1.6" text-anchor="end">LINTER</text>
      <rect x="584" y="73" width="130" height="15" rx="3" fill="#41b883" fill-opacity="0.08"/>
      <rect x="584" y="73" width="73.7" height="15" rx="3" fill="#41b883" fill-opacity="0.75"/>
      <text x="665.7" y="84.5" font-size="10.5" font-weight="700" fill="#e6edf3" text-anchor="start">68</text>
      <text x="724" y="84.5" font-size="10.5" fill="#9aa7b4">eslint-plugin-vue</text>
      <text x="572" y="115" font-size="10" fill="#6e7d8c" letter-spacing="1.6" text-anchor="end">TESTS</text>
      <rect x="584" y="104" width="130" height="15" rx="3" fill="#41b883" fill-opacity="0.08"/>
      <rect x="584" y="104" width="20.6" height="15" rx="3" fill="#41b883" fill-opacity="0.60"/>
      <text x="612.6" y="115.5" font-size="10.5" font-weight="700" fill="#e6edf3" text-anchor="start">19</text>
      <text x="724" y="115.5" font-size="10.5" fill="#9aa7b4">test-utils</text>
      <text x="572" y="146" font-size="10" fill="#6e7d8c" letter-spacing="1.6" text-anchor="end">TYPES</text>
      <rect x="584" y="135" width="130" height="15" rx="3" fill="#41b883" fill-opacity="0.08"/>
      <rect x="584" y="135" width="6.0" height="15" rx="3" fill="#41b883" fill-opacity="0.45"/>
      <text x="598.0" y="146.5" font-size="10.5" font-weight="700" fill="#e6edf3" text-anchor="start">3</text>
      <text x="724" y="146.5" font-size="10.5" fill="#9aa7b4">language-tools</text>
    </g>
    <!--/m:layers-->

    <!-- bottom sweep -->
    <rect x="0" y="176" width="854" height="4" fill="#41b883" fill-opacity="0.12"/>
    <rect x="-280" y="176" width="280" height="4" fill="url(#sweep)">
      <animate attributeName="x" from="-280" to="854" dur="6.5s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
